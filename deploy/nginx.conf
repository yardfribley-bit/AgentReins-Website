limit_req_zone $binary_remote_addr zone=agentreins_analytics:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name chuhaijian.com www.chuhaijian.com;
    return 301 https://www.chuhaijian.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chuhaijian.com;
    ssl_certificate /etc/letsencrypt/live/www.chuhaijian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.chuhaijian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /opt/agentreins-web/public;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / { try_files $uri $uri/ /index.html; }
    location = /api/visit {
        limit_req zone=agentreins_analytics burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        client_max_body_size 8k;
    }
    location /admin/ {
        auth_basic "AgentReins analytics";
        auth_basic_user_file /etc/nginx/agentreins.htpasswd;
        try_files $uri $uri/ =404;
    }
    location = /api/admin/stats {
        auth_basic "AgentReins analytics";
        auth_basic_user_file /etc/nginx/agentreins.htpasswd;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /download/apple-silicon {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
    }
    location = /download/intel {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
    }
    location ~ /\. { deny all; }
}
