<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic — AgentReins</title><link rel="stylesheet" href="/styles.css"><style>.dash{padding:55px 0}.summary{display:flex;gap:12px;margin:25px 0}.metric{border:1px solid #1c4663;background:#091b2a;border-radius:8px;padding:16px 22px}.metric b{display:block;font-size:28px}.metric span{font-size:11px;color:#8fa8bc}.table-wrap{overflow:auto;border:1px solid #1c4663;border-radius:9px}table{width:100%;border-collapse:collapse;background:#081a29;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid #163850;white-space:nowrap}th{color:#38d7ef;font-size:10px;letter-spacing:.08em}td{color:#abc0cf}td:nth-child(6){max-width:280px;overflow:hidden;text-overflow:ellipsis}</style></head>
<body><header class="nav shell"><a class="brand" href="/"><img src="/logo.png" alt=""><span>AgentReins</span></a><span class="label">PRIVATE TRAFFIC CONSOLE</span></header><main class="dash shell"><span class="label">LAUNCH TELEMETRY</span><h1>Website visitors</h1><div class="summary"><div class="metric"><b id="visits">—</b><span>RECENT VISITS</span></div><div class="metric"><b id="devices">—</b><span>DEVICE TYPES</span></div><div class="metric"><b id="refs">—</b><span>REFERRING SOURCES</span></div></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>IP</th><th>Device</th><th>OS / Browser</th><th>Page</th><th>Referrer</th><th>Screen</th><th>Language</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading evidence…</td></tr></tbody></table></div></main>
<script>fetch('/api/admin/visits').then(r=>r.json()).then(v=>{visits.textContent=v.length;devices.textContent=new Set(v.map(x=>x.device)).size;refs.textContent=new Set(v.map(x=>x.referrer).filter(Boolean)).size;rows.innerHTML=v.map(x=>`<tr><td>${e(x.time)}</td><td>${e(x.ip)}</td><td>${e(x.device)}</td><td>${e(x.os)} · ${e(x.browser)}</td><td>${e(x.path)}</td><td title="${e(x.referrer)}">${e(x.referrer)||'Direct'}</td><td>${e(x.screen)}</td><td>${e(x.language)}</td></tr>`).join('')||'<tr><td colspan="8">No visits recorded yet.</td></tr>'}).catch(()=>rows.innerHTML='<tr><td colspan="8">Unable to load analytics.</td></tr>');function e(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
