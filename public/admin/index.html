<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic — AgentReins</title><link rel="stylesheet" href="/styles.css"><style>.dash{padding:55px 0}.summary{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}.metric{border:1px solid #1c4663;background:#091b2a;border-radius:8px;padding:16px 22px;min-width:140px}.metric b{display:block;font-size:28px}.metric span{font-size:11px;color:#8fa8bc}.table-wrap{overflow:auto;border:1px solid #1c4663;border-radius:9px;margin:12px 0 35px}table{width:100%;border-collapse:collapse;background:#081a29;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid #163850;white-space:nowrap}th{color:#38d7ef;font-size:10px;letter-spacing:.08em}td{color:#abc0cf}</style></head>
<body><header class="nav shell"><a class="brand" href="/"><img src="/logo.png" alt=""><span>AgentReins</span></a><span class="label">PRIVATE TRAFFIC CONSOLE</span></header><main class="dash shell"><span class="label">LAUNCH TELEMETRY</span><h1>Website analytics</h1><div class="summary"><div class="metric"><b id="visits">—</b><span>PAGE VISITS</span></div><div class="metric"><b id="unique">—</b><span>UNIQUE IPs</span></div><div class="metric"><b id="downloads">—</b><span>TOTAL DOWNLOADS</span></div><div class="metric"><b id="apple">—</b><span>APPLE SILICON</span></div><div class="metric"><b id="intel">—</b><span>INTEL</span></div></div><span class="label">RECENT DOWNLOADS</span><div class="table-wrap"><table><thead><tr><th>Time</th><th>IP</th><th>Build</th><th>Device</th><th>OS / Browser</th><th>Referrer</th></tr></thead><tbody id="downloadRows"></tbody></table></div><span class="label">RECENT VISITS</span><div class="table-wrap"><table><thead><tr><th>Time</th><th>IP</th><th>Device</th><th>OS / Browser</th><th>Page</th><th>Referrer</th><th>Screen</th><th>Language</th></tr></thead><tbody id="visitRows"></tbody></table></div></main>
<script>fetch('/api/admin/stats').then(r=>r.json()).then(s=>{const v=s.visits,d=s.downloads;visits.textContent=v.length;unique.textContent=new Set(v.map(x=>x.ip)).size;downloads.textContent=d.length;apple.textContent=d.filter(x=>x.architecture==='Apple Silicon').length;intel.textContent=d.filter(x=>x.architecture==='Intel').length;downloadRows.innerHTML=d.map(x=>`<tr><td>${e(x.time)}</td><td>${e(x.ip)}</td><td>${e(x.architecture)}</td><td>${e(x.device)}</td><td>${e(x.os)} · ${e(x.browser)}</td><td>${e(x.referrer)||'Direct'}</td></tr>`).join('')||empty(6,'No downloads recorded yet.');visitRows.innerHTML=v.map(x=>`<tr><td>${e(x.time)}</td><td>${e(x.ip)}</td><td>${e(x.device)}</td><td>${e(x.os)} · ${e(x.browser)}</td><td>${e(x.path)}</td><td>${e(x.referrer)||'Direct'}</td><td>${e(x.screen)}</td><td>${e(x.language)}</td></tr>`).join('')||empty(8,'No visits recorded yet.')}).catch(()=>visitRows.innerHTML=empty(8,'Unable to load analytics.'));function empty(n,t){return `<tr><td colspan="${n}">${t}</td></tr>`}function e(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
